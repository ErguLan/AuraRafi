[package]
name = "raf_web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly canvas host for the AuraRafi renderer core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
raf_core = { workspace = true }
raf_render = { workspace = true }
glam = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }
uuid = { workspace = true }
console_error_panic_hook = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "console",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "Node",
    "Window",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser host executes the scene through the AGB WebGPU product device.
raf_agb = { workspace = true, features = ["webgpu"] }

# Release optimization belongs to the workspace root `[profile.release]`
# section. Cargo ignores package-local profile sections inside a workspace, so
# this manifest intentionally does not duplicate them.
