[workspace]
resolver = "2"
members = [
    "crates/raf_core",
    "crates/raf_ui",
    "crates/raf_render",
    "crates/raf_editor",
    "crates/raf_assets",
    "crates/raf_electronics",
    "crates/raf_nodes",
    "crates/raf_ai",
    "crates/raf_net",
    "crates/raf_hardware",
    "crates/raf_script",
    "crates/raf_cli",
    "editor",
]

# The editor is the default executable for `cargo run`. The headless CLI
# remains a workspace member and can be launched explicitly with
# `cargo run -p raf_cli`.
default-members = ["editor"]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AuraRafi/AuraRafi"

[workspace.dependencies]
# ECS
hecs = "0.10"

# Rendering
wgpu = "23"
winit = "0.30"
raw-window-handle = "0.6"

# Math
glam = { version = "0.29", features = ["serde"] }

# UI
egui = "0.30"
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "wgpu"] }
# RafUI uses these only to rasterize its retained text atlas. They do not
# participate in the eframe/egui widget or layout pipeline.
ab_glyph = "0.2"
epaint_default_fonts = "0.30"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"

# Internationalization
fluent = "0.16"
fluent-bundle = "0.15"

# Async / Parallelism
rayon = "1"
tokio = { version = "1", features = ["rt", "macros"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# File watching
notify = "7"

# Asset loading
image = "0.25"
gltf = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
libloading = "0.8"

# Scripting
rhai = { version = "1.19", features = ["sync"] }

# HTTP (lightweight, blocking - no async runtime needed)
ureq = { version = "2", features = ["json"] }

# Internal crates
raf_core = { path = "crates/raf_core" }
raf_ui = { path = "crates/raf_ui" }
raf_render = { path = "crates/raf_render" }
raf_editor = { path = "crates/raf_editor" }
raf_assets = { path = "crates/raf_assets" }
raf_electronics = { path = "crates/raf_electronics" }
raf_nodes = { path = "crates/raf_nodes" }
raf_ai = { path = "crates/raf_ai" }
raf_net = { path = "crates/raf_net" }
raf_hardware = { path = "crates/raf_hardware" }
raf_script = { path = "crates/raf_script" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Keep the development executable debuggable while avoiding an entirely
# unoptimized retained-UI/render path during interactive editor work.
[profile.dev.package.raf_ui]
opt-level = 2

[profile.dev.package.raf_render]
opt-level = 2

[profile.dev.package.raf_editor]
opt-level = 2
